[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "motion-graphics-studio"
version = "1.0.0"
description = "Free, offline, model-agnostic toolkit for building motion-graphics videos with code (Shorts/Reels/YouTube)."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.9"
dependencies = ["numpy>=1.23", "scipy>=1.9", "opencv-python-headless>=4.7", "Pillow>=10.0"]

[project.scripts]
mgs = "mgs.cli:main"

[tool.setuptools.packages.find]
include = ["mgs*"]
